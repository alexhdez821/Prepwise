<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrepWise — Smart Meal Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-deep: #1B1410;
    --bg-mid: #2D1F14;
    --gold: #D4A05A;
    --gold-light: #F0D4A0;
    --gold-dim: rgba(212,160,90,0.2);
    --cream: #F5E6D3;
    --text: #E8D8C8;
    --text-mid: #D4C4B0;
    --text-muted: #A89383;
    --text-dim: #7A6B5A;
    --text-faint: #5A4D40;
    --glass: rgba(255,255,255,0.04);
    --glass-border: rgba(255,255,255,0.07);
    --glass-border-light: rgba(255,255,255,0.1);
  }

  body {
    min-height: 100vh;
    background: linear-gradient(165deg, #1B1410 0%, #2D1F14 40%, #1A2316 100%);
    font-family: 'DM Sans', 'Helvetica Neue', sans-serif;
    color: var(--text);
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 520px;
    margin: 0 auto;
    padding: 32px 16px 60px;
  }

  /* ── Header ── */
  .header { text-align: center; margin-bottom: 28px; }
  .logo-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 8px; }
  .logo-icon { font-size: 36px; }
  h1 { font-family: 'Playfair Display', Georgia, serif; font-size: 38px; font-weight: 700; color: var(--cream); letter-spacing: -0.02em; }
  .subtitle { color: var(--text-muted); font-size: 15px; line-height: 1.5; }

  /* ── Card ── */
  .card {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 24px;
    backdrop-filter: blur(20px);
  }

  .section { margin-bottom: 28px; }
  .section:last-of-type { margin-bottom: 24px; }

  label.label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-mid);
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  /* ── Chips ── */
  .chip-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 24px;
    border: 1px solid var(--glass-border-light);
    background: rgba(255,255,255,0.03);
    color: #C4B5A3; font-size: 13px; cursor: pointer;
    transition: all 0.2s; user-select: none;
  }
  .chip:hover { border-color: rgba(255,255,255,0.18); }
  .chip.active {
    background: var(--gold-dim);
    border-color: var(--gold);
    color: #F5E0C0;
  }
  .chip .emoji { font-size: 18px; }

  /* ── Budget ── */
  .budget-badge {
    background: rgba(212,160,90,0.25); color: var(--gold-light);
    padding: 2px 10px; border-radius: 12px; font-size: 14px; font-weight: 700; margin-left: 8px;
  }
  input[type="range"] {
    width: 100%; accent-color: var(--gold); height: 6px;
    -webkit-appearance: none; background: rgba(255,255,255,0.08); border-radius: 4px; outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%;
    background: var(--gold); cursor: pointer; border: 2px solid var(--bg-deep);
  }
  .slider-labels { display: flex; justify-content: space-between; color: var(--text-dim); font-size: 12px; margin-top: 4px; }

  /* ── Counter ── */
  .counter-row { display: flex; align-items: center; gap: 20px; justify-content: center; }
  .counter-btn {
    width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.05);
    color: var(--gold); font-size: 22px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .counter-btn:hover { background: rgba(255,255,255,0.09); }
  .counter-value { font-size: 18px; color: var(--cream); font-weight: 600; min-width: 90px; text-align: center; }

  /* ── Text Input ── */
  .text-input {
    width: 100%; padding: 12px 16px; border-radius: 10px;
    border: 1px solid var(--glass-border-light);
    background: var(--glass); color: var(--cream); font-size: 14px;
    outline: none; font-family: 'DM Sans', sans-serif;
  }
  .text-input::placeholder { color: var(--text-dim); }
  .text-input:focus { border-color: rgba(212,160,90,0.4); }

  /* ── Number Input ── */
  .input-row { display: flex; align-items: center; gap: 12px; }
  .number-input {
    flex: 1; padding: 12px 16px; border-radius: 10px;
    border: 1px solid var(--glass-border-light);
    background: var(--glass); color: var(--cream); font-size: 14px;
    outline: none; font-family: 'DM Sans', sans-serif;
  }
  .number-input::placeholder { color: var(--text-dim); }
  .number-input:focus { border-color: rgba(212,160,90,0.4); }
  .input-suffix { color: var(--text-muted); font-size: 14px; white-space: nowrap; }

  /* ── Generate Button ── */
  .gen-btn {
    width: 100%; padding: 16px 24px; border-radius: 12px; border: none;
    background: linear-gradient(135deg, #D4A05A 0%, #B8863C 100%);
    color: var(--bg-deep); font-size: 16px; font-weight: 700; cursor: pointer;
    font-family: 'Playfair Display', Georgia, serif; letter-spacing: 0.02em;
    transition: all 0.25s; position: relative;
  }
  .gen-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(212,160,90,0.25); }
  .gen-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
  .gen-btn .loading { display: flex; align-items: center; justify-content: center; gap: 10px; }

  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    width: 18px; height: 18px;
    border: 2px solid rgba(27,20,16,0.2); border-top-color: var(--bg-deep);
    border-radius: 50%; display: inline-block; animation: spin 0.8s linear infinite;
  }

  .error-text { color: #F87171; font-size: 13px; text-align: center; margin-top: 12px; }
  .powered-by { text-align: center; color: var(--text-faint); font-size: 12px; margin-top: 24px; }

  /* ═══════ RESULTS ═══════ */
  .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .back-btn {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
    color: var(--text-muted); padding: 8px 14px; border-radius: 8px;
    cursor: pointer; font-size: 13px; transition: all 0.2s;
  }
  .back-btn:hover { background: rgba(255,255,255,0.1); }
  .logo-row-sm { display: flex; align-items: center; gap: 6px; }
  .logo-row-sm span:last-child { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; color: var(--cream); }

  /* Summary */
  .summary-strip {
    display: flex; align-items: center; justify-content: space-around;
    background: var(--glass); border: 1px solid var(--glass-border);
    border-radius: 14px; padding: 14px 8px; margin-bottom: 20px;
  }
  .summary-item { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .summary-value { color: var(--gold-light); font-size: 20px; font-weight: 700; }
  .summary-label { color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
  .summary-divider { width: 1px; height: 32px; background: rgba(255,255,255,0.08); }

  /* Calorie Progress Bar */
  .calorie-progress {
    background: var(--glass); border: 1px solid var(--glass-border);
    border-radius: 12px; padding: 16px; margin-bottom: 20px;
  }
  .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .cal-label { color: var(--text-mid); font-size: 13px; font-weight: 600; }
  .cal-values { display: flex; align-items: baseline; gap: 6px; }
  .cal-current { color: var(--gold-light); font-size: 24px; font-weight: 700; }
  .cal-target { color: var(--text-dim); font-size: 14px; }
  .progress-bar-bg {
    height: 8px; background: rgba(255,255,255,0.06); border-radius: 10px;
    overflow: hidden; position: relative;
  }
  .progress-bar-fill {
    height: 100%; background: linear-gradient(90deg, var(--gold) 0%, var(--gold-light) 100%);
    border-radius: 10px; transition: width 0.4s ease;
  }
  .progress-bar-fill.over {
    background: linear-gradient(90deg, #F59E0B 0%, #FCD34D 100%);
  }

  /* Tabs */
  .tab-row { display: flex; gap: 6px; margin-bottom: 20px; background: rgba(255,255,255,0.03); border-radius: 10px; padding: 4px; }
  .tab {
    flex: 1; padding: 10px 0; border-radius: 8px; border: none;
    background: transparent; color: var(--text-dim); font-size: 13px;
    font-weight: 600; cursor: pointer; transition: all 0.2s;
  }
  .tab.active { background: rgba(212,160,90,0.18); color: var(--gold-light); }

  /* Day Selector */
  .day-row { display: flex; gap: 6px; margin-bottom: 16px; }
  .day-btn {
    flex: 1; padding: 10px 0; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.06);
    background: rgba(255,255,255,0.03); color: var(--text-dim);
    font-size: 13px; font-weight: 600; cursor: pointer; min-width: 48px;
    transition: all 0.2s;
  }
  .day-btn.active { background: var(--gold-dim); border-color: var(--gold); color: var(--gold-light); }

  /* Meal Cards */
  .meal-cards { display: flex; flex-direction: column; gap: 10px; }
  .meal-card {
    background: var(--glass); border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px; padding: 14px 16px;
  }
  .meal-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .meal-type { color: var(--text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; flex: 1; }
  .meal-calories {
    background: rgba(212,160,90,0.15); color: var(--gold-light);
    padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600;
  }
  .meal-desc { color: var(--text); font-size: 15px; line-height: 1.5; }

  /* Grocery */
  .grocery-wrap { display: flex; flex-direction: column; gap: 16px; }
  .aisle-section {
    background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px; overflow: hidden;
  }
  .aisle-header {
    display: flex; align-items: center; gap: 8px; padding: 12px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .aisle-header .emoji { font-size: 18px; }
  .aisle-name { flex: 1; color: var(--text-mid); font-size: 14px; font-weight: 600; }
  .aisle-cost { color: var(--gold); font-size: 13px; font-weight: 600; }

  .grocery-item {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    cursor: pointer; transition: all 0.15s; border-bottom: 1px solid rgba(255,255,255,0.02);
  }
  .grocery-item:last-child { border-bottom: none; }
  .grocery-item.checked { background: rgba(212,160,90,0.06); }

  .checkbox {
    width: 22px; height: 22px; border-radius: 6px;
    border: 1.5px solid rgba(255,255,255,0.15);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: transparent; flex-shrink: 0; transition: all 0.15s;
  }
  .checkbox.checked { background: var(--gold); border-color: var(--gold); color: var(--bg-deep); }

  .grocery-info { flex: 1; display: flex; flex-direction: column; gap: 1px; }
  .grocery-name { color: var(--text); font-size: 14px; transition: all 0.15s; }
  .grocery-name.crossed { text-decoration: line-through; opacity: 0.5; }
  .grocery-qty { color: var(--text-dim); font-size: 12px; }
  .grocery-cost { color: var(--text-muted); font-size: 13px; }

  /* Tips */
  .tips-wrap { display: flex; flex-direction: column; gap: 12px; }
  .tip-card {
    display: flex; gap: 14px; background: var(--glass);
    border: 1px solid rgba(255,255,255,0.06); border-radius: 12px;
    padding: 16px; align-items: flex-start;
  }
  .tip-number {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--gold-dim); color: var(--gold-light);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; flex-shrink: 0;
  }
  .tip-text { color: var(--text-mid); font-size: 14px; line-height: 1.6; }

  .hidden { display: none !important; }

  /* Animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .meal-card, .aisle-section, .tip-card {
    animation: fadeUp 0.35s ease both;
  }
  .meal-card:nth-child(2) { animation-delay: 0.05s; }
  .meal-card:nth-child(3) { animation-delay: 0.1s; }
  .meal-card:nth-child(4) { animation-delay: 0.15s; }
</style>
</head>
<body>

<div class="wrap">
  <!-- ═══════ PREFERENCES SCREEN ═══════ -->
  <div id="prefScreen">
    <div class="header">
      <div class="logo-row">
        <span class="logo-icon">🥘</span>
        <h1>PrepWise</h1>
      </div>
      <p class="subtitle">Smart meal planning that saves you time, money, and food waste</p>
    </div>

    <div class="card">
      <!-- Dietary Preferences -->
      <div class="section">
        <label class="label">Dietary Preferences</label>
        <div class="chip-grid" id="chipGrid"></div>
      </div>

      <!-- Budget -->
      <div class="section">
        <label class="label">Weekly Budget <span class="budget-badge" id="budgetBadge">$100</span></label>
        <input type="range" min="30" max="300" step="5" value="100" id="budgetSlider">
        <div class="slider-labels"><span>$30</span><span>$300</span></div>
      </div>

      <!-- Household -->
      <div class="section">
        <label class="label">Household Size</label>
        <div class="counter-row">
          <button class="counter-btn" id="decBtn">−</button>
          <span class="counter-value" id="householdValue">2 people</span>
          <button class="counter-btn" id="incBtn">+</button>
        </div>
      </div>

      <!-- Calorie Target -->
      <div class="section">
        <label class="label">Daily Calorie Target (optional)</label>
        <div class="input-row">
          <input type="number" class="number-input" id="calorieInput" placeholder="e.g. 2000" min="800" max="5000" step="50">
          <span class="input-suffix">cal/person</span>
        </div>
      </div>

      <!-- Dislikes -->
      <div class="section">
        <label class="label">Foods to Avoid (optional)</label>
        <input type="text" class="text-input" id="dislikesInput" placeholder="e.g. mushrooms, cilantro, shellfish">
      </div>

      <!-- Generate -->
      <button class="gen-btn" id="genBtn" onclick="generatePlan()">Generate Meal Plan ✨</button>
      <p class="error-text hidden" id="errorText"></p>
    </div>

    <p class="powered-by">Powered by Claude API</p>
  </div>

  <!-- ═══════ RESULTS SCREEN ═══════ -->
  <div id="resultScreen" class="hidden">
    <div class="top-bar">
      <button class="back-btn" onclick="showPreferences()">← New Plan</button>
      <div class="logo-row-sm"><span>🥘</span><span>PrepWise</span></div>
    </div>

    <div class="summary-strip">
      <div class="summary-item"><span class="summary-value" id="sumCost">$0</span><span class="summary-label">Est. Cost</span></div>
      <div class="summary-divider"></div>
      <div class="summary-item"><span class="summary-value" id="sumServings">2</span><span class="summary-label">Servings</span></div>
      <div class="summary-divider"></div>
      <div class="summary-item"><span class="summary-value" id="sumIngredients">0</span><span class="summary-label">Ingredients</span></div>
      <div class="summary-divider"></div>
      <div class="summary-item"><span class="summary-value" id="sumChecked">0/0</span><span class="summary-label">Checked</span></div>
    </div>

    <!-- Calorie Progress (only shown if target is set) -->
    <div id="calorieProgress" class="calorie-progress hidden">
      <div class="cal-header">
        <span class="cal-label">Daily Calories</span>
        <div class="cal-values">
          <span class="cal-current" id="calCurrent">0</span>
          <span class="cal-target">/ <span id="calTarget">2000</span> cal</span>
        </div>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="calProgress" style="width: 0%"></div>
      </div>
    </div>

    <div class="tab-row">
      <button class="tab active" data-tab="meals" onclick="switchTab('meals')">🍳 Meals</button>
      <button class="tab" data-tab="grocery" onclick="switchTab('grocery')">🛒 Grocery</button>
      <button class="tab" data-tab="tips" onclick="switchTab('tips')">💡 Tips</button>
    </div>

    <div id="mealsTab"></div>
    <div id="groceryTab" class="hidden"></div>
    <div id="tipsTab" class="hidden"></div>

    <p class="powered-by">Powered by Claude API</p>
  </div>
</div>

<script>
const DIETARY_OPTIONS = [
  { id: "none", label: "No Restrictions", icon: "🍽️" },
  { id: "vegetarian", label: "Vegetarian", icon: "🥬" },
  { id: "vegan", label: "Vegan", icon: "🌱" },
  { id: "keto", label: "Keto", icon: "🥑" },
  { id: "glutenFree", label: "Gluten-Free", icon: "🌾" },
  { id: "dairyFree", label: "Dairy-Free", icon: "🥛" },
  { id: "paleo", label: "Paleo", icon: "🥩" },
  { id: "mediterranean", label: "Mediterranean", icon: "🫒" },
];

const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const DAY_SHORT = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const MEAL_META = [
  { key: "breakfast", label: "Breakfast", icon: "☀️", color: "#FEF3C7" },
  { key: "lunch", label: "Lunch", icon: "🌤️", color: "#DBEAFE" },
  { key: "dinner", label: "Dinner", icon: "🌙", color: "#EDE9FE" },
  { key: "snack", label: "Snack", icon: "🍎", color: "#FCE7F3" },
];
const AISLE_ICONS = {
  "Produce":"🥦","Meat & Seafood":"🥩","Dairy & Eggs":"🥚","Bakery":"🍞",
  "Grains & Pasta":"🌾","Canned Goods":"🥫","Frozen":"❄️",
  "Spices & Condiments":"🧂","Oils & Vinegars":"🫒","Snacks":"🍿","Beverages":"🥤","Other":"🛒"
};

let selectedDiets = [];
let budget = 100;
let household = 2;
let calorieTarget = null;
let selectedDay = 0;
let mealPlan = null;
let groceryList = null;
let tips = [];
let totalCost = 0;
let checkedItems = {};
let totalGroceryItems = 0;

// ── Init Chips ──
const chipGrid = document.getElementById("chipGrid");
DIETARY_OPTIONS.forEach(opt => {
  const el = document.createElement("button");
  el.className = "chip";
  el.dataset.id = opt.id;
  el.innerHTML = `<span class="emoji">${opt.icon}</span><span>${opt.label}</span>`;
  el.onclick = () => toggleDiet(opt.id);
  chipGrid.appendChild(el);
});

function toggleDiet(id) {
  if (id === "none") {
    selectedDiets = ["none"];
  } else {
    selectedDiets = selectedDiets.filter(d => d !== "none");
    if (selectedDiets.includes(id)) selectedDiets = selectedDiets.filter(d => d !== id);
    else selectedDiets.push(id);
  }
  document.querySelectorAll("#chipGrid .chip").forEach(el => {
    el.classList.toggle("active", selectedDiets.includes(el.dataset.id));
  });
}

// ── Budget Slider ──
const budgetSlider = document.getElementById("budgetSlider");
const budgetBadge = document.getElementById("budgetBadge");
budgetSlider.oninput = () => { budget = Number(budgetSlider.value); budgetBadge.textContent = `$${budget}`; };

// ── Household Counter ──
document.getElementById("decBtn").onclick = () => { household = Math.max(1, household - 1); updateHousehold(); };
document.getElementById("incBtn").onclick = () => { household = Math.min(10, household + 1); updateHousehold(); };
function updateHousehold() {
  document.getElementById("householdValue").textContent = `${household} ${household === 1 ? "person" : "people"}`;
}

// ── Generate Plan ──
async function generatePlan() {
  const btn = document.getElementById("genBtn");
  const errEl = document.getElementById("errorText");
  errEl.classList.add("hidden");
  btn.disabled = true;
  btn.innerHTML = `<span class="loading"><span class="spinner"></span> Crafting your meal plan...</span>`;

  const dietLabels = selectedDiets.length === 0 || selectedDiets.includes("none")
    ? "no specific dietary restrictions"
    : selectedDiets.map(d => DIETARY_OPTIONS.find(o => o.id === d)?.label).join(", ");

  const dislikes = document.getElementById("dislikesInput").value.trim();
  const calorieInput = document.getElementById("calorieInput").value.trim();
  calorieTarget = calorieInput ? parseInt(calorieInput) : null;

  let calorieInstruction = "";
  if (calorieTarget) {
    calorieInstruction = `- Daily calorie target: ${calorieTarget} calories per person\n- Include estimated calories for each meal`;
  }

  const prompt = `You are a meal prep planning expert. Create a weekly meal plan and grocery list.

Requirements:
- Dietary preferences: ${dietLabels}
- Weekly grocery budget: $${budget} USD
- Household size: ${household} people
${calorieInstruction}
${dislikes ? `- Foods to avoid: ${dislikes}` : ""}

IMPORTANT RULES:
1. Maximize ingredient overlap between meals to reduce waste and cost
2. Include breakfast, lunch, dinner, and one snack per day
3. Keep the total grocery cost under $${budget}
4. Make meals practical and realistic for home cooking
5. Vary cuisines and flavors throughout the week
${calorieTarget ? `6. Aim for meals that total approximately ${calorieTarget} calories per day per person` : ""}

Respond ONLY with valid JSON (no markdown, no backticks, no preamble) in this exact format:
{
  "meals": {
    "Monday": { 
      "breakfast": { "name": "meal name — brief description", "calories": 350 },
      "lunch": { "name": "meal name — brief description", "calories": 500 },
      "dinner": { "name": "meal name — brief description", "calories": 650 },
      "snack": { "name": "snack description", "calories": 200 }
    },
    "Tuesday": { "breakfast": {...}, "lunch": {...}, "dinner": {...}, "snack": {...} },
    "Wednesday": { "breakfast": {...}, "lunch": {...}, "dinner": {...}, "snack": {...} },
    "Thursday": { "breakfast": {...}, "lunch": {...}, "dinner": {...}, "snack": {...} },
    "Friday": { "breakfast": {...}, "lunch": {...}, "dinner": {...}, "snack": {...} },
    "Saturday": { "breakfast": {...}, "lunch": {...}, "dinner": {...}, "snack": {...} },
    "Sunday": { "breakfast": {...}, "lunch": {...}, "dinner": {...}, "snack": {...} }
  },
  "grocery": {
    "Produce": [{ "item": "ingredient name", "qty": "amount needed", "cost": 3.50 }],
    "Meat & Seafood": [],
    "Dairy & Eggs": [],
    "Bakery": [],
    "Grains & Pasta": [],
    "Canned Goods": [],
    "Frozen": [],
    "Spices & Condiments": [],
    "Oils & Vinegars": [],
    "Other": []
  },
  "totalCost": 85.50,
  "tips": ["tip 1 about prep or storage", "tip 2", "tip 3"]
}

Only include grocery categories that have items. Consolidate ingredients — if multiple meals use chicken, list it once with the total quantity needed.`;

  try {
    // Call our serverless function instead of Claude API directly
    const response = await fetch('/.netlify/functions/generate-meal-plan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt })
    });

    if (!response.ok) {
      throw new Error('Failed to generate meal plan');
    }

    const data = await response.json();
    const text = data.content.map(i => i.text || "").join("\n");
    const clean = text.replace(/```json|```/g, "").trim();
    const parsed = JSON.parse(clean);

    mealPlan = parsed.meals;
    groceryList = parsed.grocery;
    tips = parsed.tips || [];
    totalCost = parsed.totalCost || 0;
    checkedItems = {};
    selectedDay = 0;
    totalGroceryItems = Object.values(groceryList).reduce((s, items) => s + items.length, 0);

    showResults();
  } catch (err) {
    console.error(err);
    errEl.textContent = "Something went wrong generating your meal plan. Please try again.";
    errEl.classList.remove("hidden");
  } finally {
    btn.disabled = false;
    btn.innerHTML = "Generate Meal Plan ✨";
  }
}

// ── Show Screens ──
function showPreferences() {
  document.getElementById("prefScreen").classList.remove("hidden");
  document.getElementById("resultScreen").classList.add("hidden");
}

function showResults() {
  document.getElementById("prefScreen").classList.add("hidden");
  document.getElementById("resultScreen").classList.remove("hidden");
  updateSummary();
  updateCalorieProgress();
  renderDaySelector();
  renderMeals();
  renderGrocery();
  renderTips();
  switchTab("meals");
}

function updateSummary() {
  const checkedCount = Object.values(checkedItems).filter(Boolean).length;
  document.getElementById("sumCost").textContent = `$${totalCost.toFixed(0)}`;
  document.getElementById("sumServings").textContent = household;
  document.getElementById("sumIngredients").textContent = totalGroceryItems;
  document.getElementById("sumChecked").textContent = `${checkedCount}/${totalGroceryItems}`;
}

function updateCalorieProgress() {
  const progressEl = document.getElementById("calorieProgress");
  
  if (!calorieTarget) {
    progressEl.classList.add("hidden");
    return;
  }

  progressEl.classList.remove("hidden");
  
  // Calculate daily calories for selected day
  const dayMeals = mealPlan[DAYS[selectedDay]] || {};
  let dailyCalories = 0;
  MEAL_META.forEach(({ key }) => {
    const meal = dayMeals[key];
    if (meal && meal.calories) {
      dailyCalories += meal.calories;
    }
  });

  document.getElementById("calCurrent").textContent = dailyCalories;
  document.getElementById("calTarget").textContent = calorieTarget;
  
  const percentage = Math.min((dailyCalories / calorieTarget) * 100, 100);
  const fillEl = document.getElementById("calProgress");
  fillEl.style.width = `${percentage}%`;
  fillEl.classList.toggle("over", dailyCalories > calorieTarget);
}

// ── Tabs ──
function switchTab(tab) {
  document.querySelectorAll(".tab").forEach(el => el.classList.toggle("active", el.dataset.tab === tab));
  document.getElementById("mealsTab").classList.toggle("hidden", tab !== "meals");
  document.getElementById("groceryTab").classList.toggle("hidden", tab !== "grocery");
  document.getElementById("tipsTab").classList.toggle("hidden", tab !== "tips");
}

// ── Day Selector ──
function renderDaySelector() {
  const container = document.getElementById("mealsTab");
  let html = `<div class="day-row">`;
  DAY_SHORT.forEach((d, i) => {
    html += `<button class="day-btn ${i === selectedDay ? "active" : ""}" onclick="selectDay(${i})">${d}</button>`;
  });
  html += `</div><div id="mealCards" class="meal-cards"></div>`;
  container.innerHTML = html;
  renderMeals();
}

function selectDay(i) {
  selectedDay = i;
  document.querySelectorAll(".day-btn").forEach((el, idx) => el.classList.toggle("active", idx === i));
  renderMeals();
  updateCalorieProgress();
}

function renderMeals() {
  const dayMeals = mealPlan[DAYS[selectedDay]] || {};
  const container = document.getElementById("mealCards");
  if (!container) return;
  
  container.innerHTML = MEAL_META.map(({ key, label, icon, color }) => {
    const meal = dayMeals[key];
    const mealName = typeof meal === 'string' ? meal : (meal?.name || "—");
    const calories = meal?.calories;
    
    return `
    <div class="meal-card" style="border-left: 4px solid ${color}">
      <div class="meal-card-header">
        <span style="font-size:20px">${icon}</span>
        <span class="meal-type">${label}</span>
        ${calories ? `<span class="meal-calories">${calories} cal</span>` : ''}
      </div>
      <p class="meal-desc">${mealName}</p>
    </div>
  `}).join("");
}

// ── Grocery ──
function renderGrocery() {
  const container = document.getElementById("groceryTab");
  if (!groceryList) return;
  let html = `<div class="grocery-wrap">`;
  Object.entries(groceryList).forEach(([aisle, items]) => {
    if (!items || items.length === 0) return;
    const aisleTotal = items.reduce((s, i) => s + (i.cost || 0), 0);
    html += `<div class="aisle-section">
      <div class="aisle-header">
        <span class="emoji">${AISLE_ICONS[aisle] || "🛒"}</span>
        <span class="aisle-name">${aisle}</span>
        <span class="aisle-cost">$${aisleTotal.toFixed(2)}</span>
      </div>`;
    items.forEach((item, idx) => {
      const key = `${aisle}-${idx}`;
      const checked = !!checkedItems[key];
      html += `<div class="grocery-item ${checked ? "checked" : ""}" onclick="toggleGroceryItem('${key}')">
        <div class="checkbox ${checked ? "checked" : ""}">${checked ? "✓" : ""}</div>
        <div class="grocery-info">
          <span class="grocery-name ${checked ? "crossed" : ""}">${item.item}</span>
          <span class="grocery-qty">${item.qty}</span>
        </div>
        <span class="grocery-cost">$${(item.cost || 0).toFixed(2)}</span>
      </div>`;
    });
    html += `</div>`;
  });
  html += `</div>`;
  container.innerHTML = html;
}

function toggleGroceryItem(key) {
  checkedItems[key] = !checkedItems[key];
  renderGrocery();
  updateSummary();
}

// ── Tips ──
function renderTips() {
  const container = document.getElementById("tipsTab");
  if (!tips.length) {
    container.innerHTML = `<p style="color:#94A3B8;text-align:center;padding:40px">No tips available.</p>`;
    return;
  }
  container.innerHTML = `<div class="tips-wrap">${tips.map((t, i) => `
    <div class="tip-card">
      <span class="tip-number">${i + 1}</span>
      <p class="tip-text">${t}</p>
    </div>
  `).join("")}</div>`;
}
</script>
</body>
